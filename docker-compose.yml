services:

  dashboard:
    build: .
    container_name: vpn-dashboard
    restart: unless-stopped
    ports:
      - "0.0.0.0:3700:3000"
    environment:
      DB_HOST:     ${DB_HOST}
      DB_PORT:     ${DB_PORT:-3306}
      DB_USER:     ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME:     ${DB_NAME:-vpn_logs}
      NEXT_PUBLIC_REFRESH_INTERVAL: ${REFRESH_INTERVAL:-30000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
